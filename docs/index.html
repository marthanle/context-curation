<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>postcards from places i love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --matcha: #A3B18A;
    --deep-tea: #588157;
    --cream: #F5F0E6;
    --cream-back: #FBF8F1;
    --blush: #E8C7C1;
    --ink: #3A3A3A;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--cream);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  .tiny-label {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: lowercase;
    margin-bottom: 8px;
    color: var(--deep-tea);
  }

  .title-container {
    display: inline-flex;
    align-items: flex-start;
    gap: 6px;
  }

  h1 {
    font-size: clamp(2rem, 4vw, 3rem);
    font-style: italic;
    font-weight: 400;
    color: var(--ink);
    text-transform: lowercase;
    line-height: 1.1;
  }

  #wax-seal {
    width: 60px;
    height: 60px;
    background-color: #8B3A3A;
    border-radius: 50%;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 3px 6px rgba(0,0,0,0.2);
    display: inline-block;
  }

  .wax-seal {
    margin-top: -6px;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .wax-seal {
      width: 48px;
      height: 48px;
    }
  }

  .trip-tabs {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    text-transform: lowercase;
    font-size: 17px;
  }

  .trip-tab {
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    font-size: inherit;
    color: var(--ink);
    padding-bottom: 4px;
    position: relative;
    transition: color 0.2s;
  }

  .trip-tab.active {
    border-bottom: 2px solid var(--deep-tea);
    color: var(--deep-tea);
  }

  .divider {
    width: 100%;
    max-width: 700px;
    height: 1px;
    background-color: var(--matcha);
    margin: 0 auto 30px auto;
    opacity: 0.5;
  }

  /* Carousel */
  .carousel-wrapper {
    position: relative;
    width: 100%;
    max-width: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    min-height: 390px;
  }

  .carousel-track {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    perspective: 1000px;
  }

  .postcard-container {
    width: min(80vw, 560px);
    aspect-ratio: 3 / 2;
    position: absolute;
    transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    cursor: pointer;
    user-select: none;
  }

  .postcard-container.prev {
    transform: translateX(-35%) scale(0.85) rotate(-6deg);
    opacity: 0.5;
    z-index: 1;
    pointer-events: none;
  }

  .postcard-container.next {
    transform: translateX(35%) scale(0.85) rotate(6deg);
    opacity: 0.5;
    z-index: 1;
    pointer-events: none;
  }

  .postcard-container.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.7);
  }

  .postcard-container.active {
    transform: translateX(0) scale(1) rotate(0deg);
    opacity: 1;
    z-index: 2;
  }

  .postcard {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 25px rgba(58, 58, 58, 0.12);
  }

  .postcard.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background-color: var(--cream);
    border: 1px solid rgba(163, 177, 138, 0.4);
    padding: 12px 12px 28px 12px;
    display: flex;
    flex-direction: column;
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    flex-grow: 1;
  }

  .card-caption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    font-size: 14px;
    text-transform: lowercase;
    color: var(--ink);
  }

  .card-back {
    transform: rotateY(180deg);
    background-color: var(--cream-back);
    background-image: radial-gradient(rgba(58,58,58,0.03) 1px, transparent 0);
    background-size: 4px 4px;
    padding: 28px;
    display: grid;
    grid-template-columns: 58% 42%;
  }

  .back-left {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 24px;
    padding-right: 12px;
  }

  .handwritten-note {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--ink);
    text-align: left;
    line-height: 1.3;
    width: 100%;
  }

  .back-right {
    position: relative;
    border-left: 1px solid var(--matcha);
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .stamp-container {
    position: absolute;
    top: 0;
    right: 0;
    width: 70px;
    height: 85px;
    pointer-events: none;
  }

  .stamp {
    width: 70px;
    height: 82px;
    background-color: var(--blush);
    mask-image: radial-gradient(circle at 4px, transparent 4px, black 4.5px);
    mask-size: 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 6px;
  }

  .postmark {
    position: absolute;
    top: -10px;
    left: -25px;
    width: 80px;
    height: 80px;
    pointer-events: none;
    transform: rotate(-12deg);
    opacity: 0.6;
  }

  .stamp-word {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: lowercase;
    color: var(--deep-tea);
    position: absolute;
    bottom: 6px;
  }

  .address-lines {
    margin-top: 95px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-right: 10px;
  }

  .address-line {
    width: 100%;
    height: 1px;
    background-color: var(--matcha);
    opacity: 0.6;
  }

  .nav-arrow {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 24px;
    color: var(--deep-tea);
    padding: 10px;
    z-index: 10;
    transition: opacity 0.2s;
  }

  .nav-arrow:hover {
    opacity: 0.7;
  }

  .city-tabs-container {
    text-align: center;
    margin-top: 10px;
    margin-bottom: 8px;
  }

  .city-tabs {
    display: inline-flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    text-transform: lowercase;
    font-size: 16px;
  }

  .city-tab {
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    font-size: inherit;
    color: var(--ink);
    padding-bottom: 2px;
  }

  .city-tab.active {
    border-bottom: 2px solid var(--deep-tea);
    color: var(--deep-tea);
  }

  .flip-hint {
    font-style: italic;
    font-size: 14px;
    color: var(--deep-tea);
    margin-top: 6px;
    text-align: center;
    text-transform: lowercase;
  }

  footer {
    margin-top: auto;
    padding-top: 30px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: lowercase;
    color: var(--deep-tea);
    text-align: center;
  }

  @media (max-width: 600px) {
    .card-back {
      padding: 16px;
    }
    .handwritten-note {
      font-size: 18px;
    }
    .carousel-wrapper {
      min-height: 320px;
    }
  }
</style>

<style id="ml-seal-style">
[class*="seal"]:not(.ml-seal):not(.ml-seal-wrap):not(:has(h1)), [id*="seal"]:not(:has(h1)) { display: none !important; }
.ml-seal-wrap { display: inline-block; margin-left: 28px; vertical-align: top; position: relative; top: -18px; line-height: 0; }
@media (max-width: 600px) { .ml-seal { width: 46px; height: 46px; } .ml-seal-wrap { margin-left: 12px; top: -8px; } }
</style>

  let currentTripKey = trips[0].name + " " + trips[0].year;
  let currentCityIndex = 0;
  let currentIndex = 0;

  const tripTabsEl = document.getElementById('tripTabs');
  const cityTabsEl = document.getElementById('cityTabs');
  const carouselTrack = document.getElementById('carouselTrack');
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');

  function renderTripTabs() {
    tripTabsEl.innerHTML = '';
    trips.forEach(t => {
      const key = t.name + " " + t.year;
      const btn = document.createElement('button');
      btn.className = `trip-tab ${key === currentTripKey ? 'active' : ''}`;
      btn.textContent = key;
      btn.onclick = () => {
        currentTripKey = key;
        currentCityIndex = 0;
        currentIndex = 0;
        renderTripTabs();
        renderCityTabs();
        renderCarousel();
      };
      tripTabsEl.appendChild(btn);
    });
  }

  function renderCityTabs() {
    cityTabsEl.innerHTML = '';
    const tripObj = tripData[currentTripKey];
    tripObj.cities.forEach((c, idx) => {
      const btn = document.createElement('button');
      btn.className = `city-tab ${idx === currentCityIndex ? 'active' : ''}`;
      btn.textContent = c.name;
      btn.onclick = () => {
        currentCityIndex = idx;
        currentIndex = 0;
        renderCityTabs();
        renderCarousel();
      };
      cityTabsEl.appendChild(btn);
    });
  }

  function getStampSVG(tripName) {
    if (tripName.includes('japan')) {
      return `<svg viewBox="0 0 70 70" width="35" height="35"><circle cx="45" cy="35" r="12" fill="none" stroke="#588157" stroke-width="1.5"/><path d="M15 50 L35 25 L55 50 Z" fill="none" stroke="#588157" stroke-width="1.5"/><path d="M25 50 Q35 45 45 50" fill="none" stroke="#588157" stroke-width="1.5"/></svg>`;
    } else if (tripName.includes('cancun')) {
      return `<svg viewBox="0 0 70 70" width="35" height="35"><path d="M35 15 C30 25 30 35 35 50 C40 35 40 25 35 15 Z" fill="none" stroke="#588157" stroke-width="1.5"/><path d="M20 30 Q27 25 35 30 Q43 35 50 30" fill="none" stroke="#588157" stroke-width="1.5"/><path d="M15 45 Q35 38 55 45" fill="none" stroke="#588157" stroke-width="1.5"/></svg>`;
    } else if (tripName.includes('los angeles')) {
      return `<svg viewBox="0 0 70 70" width="35" height="35"><circle cx="35" cy="40" r="10" fill="none" stroke="#588157" stroke-width="1.5"/><path d="M35 15 C25 25 25 35 35 55 C45 35 45 25 35 15 Z" fill="none" stroke="#588157" stroke-width="1.5"/><line x1="15" y1="55" x2="55" y2="55" stroke="#588157" stroke-width="1.5"/></svg>`;
    } else if (tripName.includes('switzerland')) {
      return `<svg viewBox="0 0 70 70" width="35" height="35"><path d="M20 50 L35 20 L50 50 Z" fill="none" stroke="#588157" stroke-width="1.5"/><polyline points="30,32 35,40 42,30" fill="none" stroke="#588157" stroke-width="1.5"/></svg>`;
    } else {
      // Default / Mountains for Banff / France
      return `<svg viewBox="0 0 70 70" width="35" height="35"><path d="M15 50 L35 20 L55 50 Z" fill="none" stroke="#588157" stroke-width="1.5"/><path d="M25 50 L40 30 L50 50 Z" fill="none" stroke="#588157" stroke-width="1.5"/></svg>`;
    }
  }

  function getPostmarkSVG(cityName) {
    const cityNameUpper = cityName.toUpperCase();
    return `<svg viewBox="0 0 100 100" width="80" height="80">
      <defs>
        <path id="curve" d="M 20,50 A 30,30 0 1,1 80,50" />
      </defs>
      <circle cx="50" cy="50" r="32" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="28" fill="none" stroke="#3A3A3A" stroke-width="0.75"/>
      <text font-size="8" font-family="Georgia, serif" fill="#3A3A3A" letter-spacing="2">
        <textPath href="#curve" startOffset="50%" text-anchor="middle">${cityNameUpper}</textPath>
      </text>
      <line x1="5" y1="50" x2="22" y2="50" stroke="#3A3A3A" stroke-width="1"/>
      <line x1="2" y1="58" x2="20" y2="58" stroke="#3A3A3A" stroke-width="1"/>
      <line x1="8" y1="42" x2="24" y2="42" stroke="#3A3A3A" stroke-width="1"/>
    </svg>`;
  }

  function renderCarousel() {
    carouselTrack.innerHTML = '';
    const tripObj = tripData[currentTripKey];
    const cityObj = tripObj.cities[currentCityIndex];
    const postcards = cityObj.postcards;

    postcards.forEach((pc, idx) => {
      const container = document.createElement('div');
      let posClass = 'hidden';
      if (idx === currentIndex) posClass = 'active';
      else if (idx === (currentIndex - 1 + postcards.length) % postcards.length) posClass = 'prev';
      else if (idx === (currentIndex + 1) % postcards.length) posClass = 'next';

      container.className = `postcard-container ${posClass}`;

      const romanNums = ["plate i.", "plate ii.", "plate iii.", "plate iv.", "plate v.", "plate vi.", "plate vii.", "plate viii.", "plate ix.", "plate x."];
      const roman = romanNums[idx] || "plate i.";

      container.innerHTML = `
        <div class="postcard">
          <div class="card-face card-front">
            <img src="${pc.img}" alt="postcard photo">
            <div class="card-caption">
              <span>${pc.caption}</span>
              <span>${roman}</span>
            </div>
          </div>
          <div class="card-face card-back">
            <div class="back-left">
              <div class="handwritten-note">${pc.note}</div>
            </div>
            <div class="back-right">
              <div class="stamp-container">
                <div class="stamp">
                  ${getPostmarkSVG(cityObj.name)}
                  ${getStampSVG(currentTripKey)}
                  <span class="stamp-word">souvenir</span>
                </div>
              </div>
              <div class="address-lines">
                <div class="address-line"></div>
                <div class="address-line"></div>
                <div class="address-line"></div>
              </div>
            </div>
          </div>
        </div>
      `;

      container.onclick = (e) => {
        if (container.classList.contains('active')) {
          const card = container.querySelector('.postcard');
          card.classList.toggle('flipped');
        } else {
          currentIndex = idx;
          renderCarousel();
        }
      };

      carouselTrack.appendChild(container);
    });
  }

  function changeSlide(direction) {
    const tripObj = tripData[currentTripKey];
    const cityObj = tripObj.cities[currentCityIndex];
    const len = cityObj.postcards.length;
    currentIndex = (currentIndex + direction + len) % len;
    renderCarousel();
  }

  prevArrow.onclick = () => changeSlide(-1);
  nextArrow.onclick = () => changeSlide(1);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') changeSlide(-1);
    if (e.key === 'ArrowRight') changeSlide(1);
  });

  // Touch swipe support
  let touchStartX = 0;
  carouselTrack.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  });
  carouselTrack.addEventListener('touchend', e => {
    let touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 50) changeSlide(1);
    if (touchEndX > touchStartX + 50) changeSlide(-1);
  });

  // Initial render
  renderTripTabs();
  renderCityTabs();
  renderCarousel();
</script>
