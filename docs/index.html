<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>postcards from places i love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --matcha: #A3B18A;
            --deep-tea: #588157;
            --warm-cream: #F5F0E6;
            --paper-bg: #FBF8F1;
            --soft-blush: #E8C7C1;
            --ink: #3A3A3A;
            --card-border: #E3DCD0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--warm-cream);
            color: var(--ink);
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        /* Header */
        .collection-label {
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: lowercase;
            color: var(--deep-tea);
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.8rem;
            font-style: italic;
            font-weight: 400;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Trip Tabs */
        .trip-tabs {
            display: flex;
            gap: 28px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            background: none;
            border: none;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.15rem;
            text-transform: lowercase;
            cursor: pointer;
            color: var(--ink);
            padding-bottom: 4px;
            transition: color 0.2s ease;
        }

        .tab.active {
            border-bottom: 2px solid var(--deep-tea);
            color: var(--deep-tea);
        }

        .divider {
            width: 100%;
            max-width: 700px;
            height: 1px;
            background-color: var(--card-border);
            margin: 10px 0 35px 0;
        }

        /* Carousel Area */
        .carousel-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            min-height: 380px;
        }

        .nav-arrow {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--deep-tea);
            cursor: pointer;
            padding: 0 15px;
            z-index: 10;
            transition: opacity 0.2s;
        }

        .nav-arrow:hover {
            opacity: 0.7;
        }

        .cards-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 650px;
            position: relative;
            perspective: 1000px;
            height: 380px;
        }

        /* Postcard Structure */
        .postcard-wrapper {
            position: absolute;
            width: min(80vw, 560px);
            aspect-ratio: 3 / 2;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            user-select: none;
        }

        .postcard-wrapper.prev {
            transform: translateX(-35%) scale(0.85) rotate(-4deg);
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
        }

        .postcard-wrapper.next {
            transform: translateX(35%) scale(0.85) rotate(4deg);
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
        }

        .postcard-wrapper.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.7);
        }

        .postcard-wrapper.active {
            transform: translateX(0) scale(1) rotate(0deg);
            opacity: 1;
            z-index: 5;
        }

        .postcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(58, 58, 58, 0.08);
        }

        .postcard-wrapper.flipped .postcard {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: var(--paper-bg);
            border: 8px solid var(--warm-cream);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
        }

        /* Front Face */
        .card-front img {
            width: 100%;
            height: calc(100% - 32px);
            object-fit: cover;
            display: block;
        }

        .card-caption {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            font-size: 0.9rem;
            text-transform: lowercase;
            color: var(--ink);
            background-color: var(--warm-cream);
        }

        /* Back Face */
        .card-back {
            transform: rotateY(180deg);
            display: grid;
            grid-template-columns: 58% 42%;
            padding: 28px;
            background-color: var(--paper-bg);
        }

        .note-column {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 24px;
            padding-right: 10px;
        }

        .handwritten-note {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            color: #4A4A4A;
            line-height: 1.35;
            text-align: left;
            text-transform: lowercase;
        }

        .address-column {
            border-left: 1px solid var(--matcha);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: 24px;
            position: relative;
        }

        .stamp-area {
            align-self: flex-end;
            position: relative;
            width: 70px;
            height: 85px;
        }

        .stamp {
            width: 70px;
            height: 85px;
            background-color: var(--soft-blush);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .stamp svg {
            width: 45px;
            height: 45px;
        }

        .stamp-text {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: lowercase;
            color: var(--deep-tea);
            margin-top: 4px;
        }

        .postmark {
            position: absolute;
            top: 25px;
            left: -35px;
            width: 80px;
            height: 80px;
            opacity: 0.6;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .address-lines {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .address-line {
            width: 100%;
            height: 1px;
            background-color: var(--matcha);
            opacity: 0.5;
        }

        /* City Tabs */
        .city-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .city-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .city-tab {
            background: none;
            border: none;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1rem;
            text-transform: lowercase;
            cursor: pointer;
            color: var(--ink);
            padding-bottom: 2px;
        }

        .city-tab.active {
            border-bottom: 2px solid var(--deep-tea);
            color: var(--deep-tea);
        }

        .instruction-text {
            font-style: italic;
            font-size: 0.9rem;
            color: var(--deep-tea);
            margin-bottom: 25px;
        }

        /* Footer */
        footer {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            color: var(--deep-tea);
            margin-top: 40px;
            text-align: center;
        }

        @media(max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .card-back { padding: 16px; }
            .handwritten-note { font-size: 18px; }
            .carousel-container { min-height: 280px; }
            .cards-stage { height: 280px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="collection-label">a personal collection</div>
        <h1>postcards from places i love.</h1>

        <div class="trip-tabs" id="tripTabs"></div>
        <div class="divider"></div>

        <div class="carousel-container">
            <button class="nav-arrow" id="prevBtn">&#8249;</button>
            <div class="cards-stage" id="cardsStage"></div>
            <button class="nav-arrow" id="nextBtn">&#8250;</button>
        </div>

        <div class="city-section">
            <div class="city-tabs" id="cityTabs"></div>
            <div class="instruction-text">click a postcard to turn it over</div>
        </div>
    </div>

    <footer>collected slowly, kept forever.</footer>

    <script>
        const trips = [
            {
                name: "banff",
                year: 2025,
                folder: "banff-2025",
                stops: [
                    {
                        name: "banff",
                        photos: [
                            { file: "trips/banff-2025/01-banff/IMG_6744.JPG", note: "we went white water rafting on cold glacial water and everyone was completely soaked and laughing." },
                            { file: "trips/banff-2025/01-banff/R0000420.jpg", note: "deep blue lake reflecting giant mountains while we stood quietly at the water edge." },
                            { file: "trips/banff-2025/01-banff/R0000432.JPG", note: "small orange boats floating softly on the glassy blue surface of the lake." },
                            { file: "trips/banff-2025/01-banff/R0000633.JPG", note: "paddling out on the turquoise water with mountains all around us making us feel so small." },
                            { file: "trips/banff-2025/01-banff/R0000677.JPG", note: "posing near the water with snow peaks behind us and cold crisp air everywhere." },
                            { file: "trips/banff-2025/01-banff/R0000715.JPG", note: "hiking near roaring waterfalls with the best views across the entire valley." },
                            { file: "trips/banff-2025/01-banff/R0000779.JPG", note: "stopping at every single viewpoint because the mountain panoramas were just breathtaking." }
                        ]
                    }
                ]
            },
            {
                name: "france",
                year: 2026,
                folder: "france-2026",
                stops: [
                    {
                        name: "chamonix",
                        photos: [
                            { file: "trips/france-2026/01-chamonix/R0002402.JPG", note: "we ducked into a warm bakery out of the chill and picked up fresh pastries." },
                            { file: "trips/france-2026/01-chamonix/R0002424.JPG", note: "walking through the ice cave tunnel where everything glowed in shades of brilliant blue." },
                            { file: "trips/france-2026/01-chamonix/R0002444.JPG", note: "strolling past charming storefronts in the mountain air before dinner." },
                            { file: "trips/france-2026/01-chamonix/R0002461.JPG", note: "vast rocky peaks towering above the green forests under a clear sky." },
                            { file: "trips/france-2026/01-chamonix/R0002516.JPG", note: "standing at high elevation looking out at the endless snow capped summits." }
                        ]
                    },
                    {
                        name: "annecy",
                        photos: [
                            { file: "trips/france-2026/02-annecy/R0002549.JPG", note: "wandering narrow cobblestone streets beneath old rustic timber framed buildings." },
                            { file: "trips/france-2026/02-annecy/R0002567.JPG", note: "canals reflecting pastel buildings with bright flowers blooming by the water." },
                            { file: "trips/france-2026/02-annecy/R0002594.JPG", note: "smiling by the lakeside while the afternoon sun warmed the old town." },
                            { file: "trips/france-2026/02-annecy/R0002616.JPG", note: "taking out a paddle boat on the glassy crystal clear lake." },
                            { file: "trips/france-2026/02-annecy/R0002632.JPG", note: "stepping inside historic halls with high ornate ceilings and stained glass." }
                        ]
                    },
                    {
                        name: "paris",
                        photos: [
                            { file: "trips/france-2026/03-paris/R0002879.jpg", note: "catching a glimpse of the eiffel tower while wandering the city streets." },
                            { file: "trips/france-2026/03-paris/R0002909.JPG", note: "choosing colorful macarons from a glowing display case in the afternoon." },
                            { file: "trips/france-2026/03-paris/R0003031.JPG", note: "quiet moments admiring classical architecture and glowing art exhibits." },
                            { file: "trips/france-2026/03-paris/R0003088.JPG", note: "surrounded by massive vibrant water lily paintings in a sunlit gallery." },
                            { file: "trips/france-2026/03-paris/R0003186.JPG", note: "browsing little display shelves filled with charming trinkets and gifts." },
                            { file: "trips/france-2026/03-paris/R0003201.JPG", note: "sharing a wonderful bistro dinner with rich sauce and golden potatoes." }
                        ]
                    }
                ]
            },
            {
                name: "japan",
                year: 2026,
                folder: "japan-2026",
                stops: [
                    {
                        name: "japan",
                        photos: [
                            { file: "trips/japan-2026/01-japan/R0001381.JPG", note: "stopping for cold drinks at a cozy pub tucked away down a quiet alley." },
                            { file: "trips/japan-2026/01-japan/R0001421.JPG", note: "we got ice cream cones in the snow and it was so worth it." },
                            { file: "trips/japan-2026/01-japan/R0001447.JPG", note: "walking through small neighborhood streets past local shops in the cold." },
                            { file: "trips/japan-2026/01-japan/R0001464.JPG", note: "bundled up in heavy winter coats while exploring snowy town paths." },
                            { file: "trips/japan-2026/01-japan/R0001507.jpg", note: "looking out at the rugged coastline where waves crashed against ancient rock pillars." },
                            { file: "trips/japan-2026/01-japan/R0001532.JPG", note: "sitting quietly by the ocean watching the distant horizon over the water." },
                            { file: "trips/japan-2026/01-japan/R0001563.JPG", note: "strolling through peaceful gardens while delicate cherry blossoms began to open." },
                            { file: "trips/japan-2026/01-japan/R0001640.JPG", note: "snacking on warm street food while wandering through bustling night markets." },
                            { file: "trips/japan-2026/01-japan/R0001665.JPG", note: "bright pink blossoms heavy on the branches filling the air with spring." },
                            { file: "trips/japan-2026/01-japan/R0001684.JPG", note: "stopping for photos together under a blooming tree on a lovely afternoon." }
                        ]
                    }
                ]
            }
        ];

        // Sort trips exactly per instructions
        trips.sort((a, b) => a.year - b.year || a.name.localeCompare(b.name));

        let currentTripIndex = 0;
        let currentCityIndex = 0;
        let currentCardIndex = 0;

        const tripTabsEl = document.getElementById('tripTabs');
        const cityTabsEl = document.getElementById('cityTabs');
        const cardsStageEl = document.getElementById('cardsStage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function renderTripTabs() {
            tripTabsEl.innerHTML = '';
            trips.forEach((trip, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab ${idx === currentTripIndex ? 'active' : ''}`;
                btn.textContent = `${trip.name} ${trip.year}`;
                btn.addEventListener('click', () => {
                    currentTripIndex = idx;
                    currentCityIndex = 0;
                    currentCardIndex = 0;
                    renderAll();
                });
                tripTabsEl.appendChild(btn);
            });
        }

        function renderCityTabs() {
            cityTabsEl.innerHTML = '';
            const trip = trips[currentTripIndex];
            trip.stops.forEach((stop, idx) => {
                const btn = document.createElement('button');
                btn.className = `city-tab ${idx === currentCityIndex ? 'active' : ''}`;
                btn.textContent = stop.name;
                btn.addEventListener('click', () => {
                    currentCityIndex = idx;
                    currentCardIndex = 0;
                    renderAll();
                });
                cityTabsEl.appendChild(btn);
            });
        }

        function getRomanNumeral(num) {
            const romans = ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii", "ix", "x", "xi", "xii", "xiii", "xiv", "xv"];
            return romans[num] || (num + 1);
        }

        function getStampSvg(tripName) {
            if (tripName === 'japan') {
                return `<svg viewBox="0 0 100 100"><circle cx="70" cy="35" r="12" fill="none" stroke="#588157" stroke-width="3"/><path d="M15 75 L35 45 L50 60 L65 40 L85 75 Z" fill="none" stroke="#588157" stroke-width="3" stroke-linejoin="round"/></svg>`;
            } else if (tripName === 'banff') {
                return `<svg viewBox="0 0 100 100"><path d="M20 70 L50 30 L80 70 Z" fill="none" stroke="#588157" stroke-width="3"/><path d="M35 70 Q50 55 65 70" fill="none" stroke="#588157" stroke-width="3"/></svg>`;
            } else {
                return `<svg viewBox="0 0 100 100"><path d="M50 20 Q70 40 50 80 Q30 40 50 20" fill="none" stroke="#588157" stroke-width="3"/></svg>`;
            }
        }

        function renderCarousel() {
            cardsStageEl.innerHTML = '';
            const trip = trips[currentTripIndex];
            const stop = trip.stops[currentCityIndex];
            const photos = stop.photos;

            photos.forEach((photoData, idx) => {
                const wrapper = document.createElement('div');
                let posClass = 'hidden';
                if (idx === currentCardIndex) posClass = 'active';
                else if (idx === (currentCardIndex - 1 + photos.length) % photos.length) posClass = 'prev';
                else if (idx === (currentCardIndex + 1) % photos.length) posClass = 'next';

                wrapper.className = `postcard-wrapper ${posClass}`;
                
                const imgSrc = photoData.file.replace('trips/', 'photos/');
                const placeName = trip.name === 'japan' ? 'japan' : `${stop.name}, ${trip.name.split('-')[0]}`;
                const plateText = `plate ${getRomanNumeral(idx)}.`;

                wrapper.innerHTML = `
                    <div class="postcard">
                        <div class="card-face card-front">
                            <img src="${imgSrc}" alt="postcard photo" loading="lazy">
                            <div class="card-caption">
                                <span>${placeName}</span>
                                <span>${plateText}</span>
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <div class="note-column">
                                <div class="handwritten-note">${photoData.note}</div>
                            </div>
                            <div class="address-column">
                                <div class="stamp-area">
                                    <svg class="postmark" viewBox="0 0 100 100">
                                        <defs>
                                            <path id="curve-${idx}" d="M 15,50 A 35,35 0 1,1 85,50" />
                                        </defs>
                                        <circle cx="50" cy="50" r="38" fill="none" stroke="#888" stroke-width="2"/>
                                        <circle cx="50" cy="50" r="33" fill="none" stroke="#888" stroke-width="1"/>
                                        <text font-size="11" fill="#666" font-family="sans-serif" letter-spacing="2">
                                            <textPath href="#curve-${idx}" startOffset="50%" text-anchor="middle">${placeName.toUpperCase()}</textPath>
                                        </text>
                                        <line x1="5" y1="65" x2="25" y2="65" stroke="#888" stroke-width="2"/>
                                        <line x1="2" y1="73" x2="22" y2="73" stroke="#888" stroke-width="2"/>
                                    </svg>
                                    <div class="stamp">
                                        ${getStampSvg(trip.name)}
                                        <div class="stamp-text">souvenir</div>
                                    </div>
                                </div>
                                <div class="address-lines">
                                    <div class="address-line"></div>
                                    <div class="address-line"></div>
                                    <div class="address-line"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                wrapper.addEventListener('click', (e) => {
                    if (wrapper.classList.contains('active')) {
                        wrapper.classList.toggle('flipped');
                    } else {
                        currentCardIndex = idx;
                        renderCarousel();
                    }
                });

                cardsStageEl.appendChild(wrapper);
            });
        }

        function changeCard(direction) {
            const trip = trips[currentTripIndex];
            const stop = trip.stops[currentCityIndex];
            const count = stop.photos.length;
            currentCardIndex = (currentCardIndex + direction + count) % count;
            renderCarousel();
        }

        prevBtn.addEventListener('click', () => changeCard(-1));
        nextBtn.addEventListener('click', () => changeCard(1));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeCard(-1);
            if (e.key === 'ArrowRight') changeCard(1);
        });

        // Touch swipe support
        let touchStartX = 0;
        cardsStageEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });
        cardsStageEl.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) changeCard(1);
            if (touchEndX > touchStartX + 50) changeCard(-1);
        });

        function renderAll() {
            renderTripTabs();
            renderCityTabs();
            renderCarousel();
        }

        renderAll();
    </script>
</body>
</html>
